name: creador_cotizaciones
description: "Sistema profesional para crear, gestionar y exportar cotizaciones."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  universal_io: ^2.2.2
  pdf: ^3.10.8
  printing: ^5.12.0
  docx_template_fork: ^0.5.0
  archive: ^4.0.2
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  intl: ^0.20.2
  image_picker: ^1.0.7
  uuid: ^4.3.3
  path: ^1.9.1
  shared_preferences: ^2.2.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.1.0
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  cloud_functions: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/plantilla.docx
